title: Punkte im Koordinatensystem mit vier Quadranten ablesen und eintragen
dest: [6DA]
type: text
textSize: medium
description: "Koordinaten eines Punktes ablesen, Punkt eintragen: x-Koordinate, y-Koordinate, Koordinatensystem, vier Quadranten, negative Zahlen. Die Variante „Punkt eintragen“ ist für den interaktiven Modus (online/Duell) nicht geeignet."
options:
  - name: Koordinaten ablesen
    vars:
      sX: [-1, 1]
      sY: [-1, 1]
      x: ${:sX>0 ? '0_5':'-5_0'}
      y: ${:sY>0 ? '0_5':'-5_0'}
    figure:
      type: graph
      scale: 3
      boundingbox: [-6, 6, 6, -6]
      keepAspect: false
      axis: false
      grid: true
      content:
        - - axis
          - [[0, 0], [1, 0]]
          - { ticks: { label: { fontsize: 24, anchorx: "middle", anchory: "top", offset: [0, -3] } } }
        - - axis
          - [[0, 0], [0, 1]]
          - { ticks: { label: { fontsize: 24, anchorx: "right", anchory: "middle", offset: [-6, 0] } } }
        - - point
          - [:x, :y]
          - { face: "x", size: 9, strokeWidth: 3, label: { fontsize: 24 } }
    question:
      - Gib die x-Koordinate von A an.
      - Gib die y-Koordinate von A an.
      - Gib die Koordinaten des Punktes A an.
    answer:
      - Die x-Koordinate von A ist <span class='red'>:x</span>.
      - Die y-Koordinate von A ist <span class='red'>:y</span>.
      - Der Punkt hat die Koordinaten <span class='red'>A(:x|:y)</span>.
    value: (:x, :y)
  - name: Punkt eintragen
    vars:
      sX: [-1, 1]
      sY: [-1, 1]
      x: ${:sX>0 ? '0_5':'-5_0'}
      y: ${:sY>0 ? '0_5':'-5_0'}
    figure:
      type: graph
      scale: 3
      boundingbox: [-6, 6, 6, -6]
      keepAspect: false
      axis: false
      grid: true
      content:
        - - axis
          - [[0, 0], [1, 0]]
          - { ticks: { label: { fontsize: 24, anchorx: "middle", anchory: "top", offset: [0, -3] } } }
        - - axis
          - [[0, 0], [0, 1]]
          - { ticks: { label: { fontsize: 24, anchorx: "right", anchory: "middle", offset: [-6, 0] } } }
    question: Trage den Punkt A(:x|:y) in das Koordinatensystem ein.
    answer: ""
    figureCorrection:
      type: graph
      scale: 3
      boundingbox: [-6, 6, 6, -6]
      keepAspect: false
      axis: false
      grid: true
      content:
        - - axis
          - [[0, 0], [1, 0]]
          - { ticks: { label: { fontsize: 24, anchorx: "middle", anchory: "top", offset: [0, -3] } } }
        - - axis
          - [[0, 0], [0, 1]]
          - { ticks: { label: { fontsize: 24, anchorx: "right", anchory: "middle", offset: [-6, 0] } } }
        - - point
          - [:x, :y]
          - { face: "x", size: 9, strokeWidth: 3, label: { fontsize: 24 } }
