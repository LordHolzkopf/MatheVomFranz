title: Stufen-, Wechsel- und Scheitelwinkel erkennen
description: Winkel an geschnittenen Geraden und Parallelen, zwei Geraden und eine Schnittgerade, Stufenwinkel, Wechselwinkel, Scheitelwinkel, Nebenwinkel, Supplementwinkel, Winkelbeziehungen erkennen
dest: [7EA]
type: text
keys:
  - o
  - n
  - corr
  - supp
  - altint
  - ad&sup
  - opps
  - ssln
repeat: 4
consts:
  colors: [
      black,
      blue,
      red,
      green,
      purple,
      orange,
      brown,
      grey,
      chocolate,
      coral,
      darkblue,
      darkcyan,
      indigo,
      olive,
      violet,
      navy,
      orangered,
      teal,
      tomato,
      turquoise,
    ]
vars:
  prop: [true, false]
  cc: "0_${:colors.length-1}_8_^&"
  sizes: "10_25_8"
options:
  - name: Stufenwinkel erkennen
    consts:
      corr: [[1, 5], [2, 6], [3, 7], [4, 8]]
      autre:
        [
          [1, 8],
          [2, 7],
          [1, 6],
          [2, 5],
          [4, 5],
          [3, 6],
          [4, 7],
          [3, 8],
          [1, 2],
          [2, 3],
          [3, 4],
          [4, 1],
          [5, 6],
          [6, 7],
          [7, 8],
          [8, 5],
          [1, 3],
          [2, 4],
          [5, 7],
          [6, 8],
          [2, 8],
          [3, 5],
        ]
    vars:
      paire: "0_${:prop?:corr.length-1::autre.length-1}"
      a1: "${:prop?:corr[:paire][0]::autre[:paire][0]}"
      a2: "${:prop?:corr[:paire][1]::autre[:paire][1]}"
      ang1: "70_110"
      ang2: "70_110_^${:ang1},${:ang1-1},${:ang1+1}"
    question: "Sind die markierten Winkel Stufenwinkel?"
    answer: "${:prop?'Ja':'Nein'}, die markierten Winkel sind <b>${:prop?'':'keine '}Stufenwinkel</b>."
    value: ["${:prop?'\\text{ja}':'\\text{nein}'}", "${:prop?'ja':'nein'}"]
  - name: Wechselwinkel erkennen
    consts:
      alt: [[2, 8], [3, 5]]
      autre:
        [
          [1, 8],
          [2, 7],
          [1, 6],
          [2, 5],
          [4, 5],
          [3, 6],
          [4, 7],
          [3, 8],
          [1, 2],
          [2, 3],
          [3, 4],
          [4, 1],
          [5, 6],
          [6, 7],
          [7, 8],
          [8, 5],
          [1, 5],
          [2, 6],
          [3, 7],
          [4, 8],
          [1, 3],
          [2, 4],
          [5, 7],
          [6, 8],
        ]
    vars:
      paire: "0_${:prop?:alt.length-1::autre.length-1}"
      a1: "${:prop?:alt[:paire][0]::autre[:paire][0]}"
      a2: "${:prop?:alt[:paire][1]::autre[:paire][1]}"
      ang1: "70_110"
      ang2: "70_110_^${:ang1},${:ang1-1},${:ang1+1}"
    question: "Sind die markierten Winkel Wechselwinkel?"
    answer: "${:prop?'Ja':'Nein'}, die markierten Winkel sind <b>${:prop?'':'keine '}Wechselwinkel</b>."
    value: ["${:prop?'\\text{ja}':'\\text{nein}'}", "${:prop?'ja':'nein'}"]
  - name: Scheitelwinkel erkennen
    consts:
      opp: [[1, 3], [2, 4], [5, 7], [6, 8]]
      autre:
        [
          [1, 8],
          [2, 7],
          [1, 6],
          [2, 5],
          [4, 5],
          [3, 6],
          [4, 7],
          [3, 8],
          [1, 2],
          [2, 3],
          [3, 4],
          [4, 1],
          [5, 6],
          [6, 7],
          [7, 8],
          [8, 5],
          [1, 5],
          [2, 6],
          [3, 7],
          [4, 8],
          [2, 8],
          [3, 5],
        ]
    vars:
      paire: "0_${:prop?:opp.length-1::autre.length-1}"
      a1: "${:prop?:opp[:paire][0]::autre[:paire][0]}"
      a2: "${:prop?:opp[:paire][1]::autre[:paire][1]}"
      ang1: "70_110"
      ang2: "70_110_^${:ang1},${:ang1-1},${:ang1+1}"
    question: "Sind die markierten Winkel Scheitelwinkel?"
    answer: "${:prop?'Ja':'Nein'}, die markierten Winkel sind <b>${:prop?'':'keine '}Scheitelwinkel</b>."
    value: ["${:prop?'\\text{ja}':'\\text{nein}'}", "${:prop?'ja':'nein'}"]
  - name: Winkel an zwei nicht parallelen Geraden
    consts:
      adj: [[1, 2], [2, 3], [3, 4], [4, 1], [5, 6], [6, 7], [7, 8], [8, 5]]
      corr: [[1, 5], [2, 6], [3, 7], [4, 8]]
      opp: [[1, 3], [2, 4], [5, 7], [6, 8]]
      alt: [[2, 8], [3, 5]]
      autre: [[1, 8], [2, 7], [1, 6], [2, 5], [4, 5], [3, 6], [4, 7], [3, 8]]
    vars:
      chx: "0_4"
      paire: "0_${:chx==0?:adj.length-1::chx==1?:corr.length-1::chx==2?:opp.length-1::chx==3?:alt.length-1::autre.length-1}"
      a1: "${:chx==0?:adj[:paire][0]::chx==1?:corr[:paire][0]::chx==2?:opp[:paire][0]::chx==3?:alt[:paire][0]::autre[:paire][0]}"
      a2: "${:chx==0?:adj[:paire][1]::chx==1?:corr[:paire][1]::chx==2?:opp[:paire][1]::chx==3?:alt[:paire][1]::autre[:paire][1]}"
      ang1: "70_110"
      ang2: "70_110_^${:ang1},${:ang1-1},${:ang1+1}"
    question: "Die beiden Geraden sind nicht parallel. Welche Beziehung besteht zwischen den markierten Winkeln?<br><i>Wähle: Nebenwinkel, Supplementwinkel, Stufenwinkel, Scheitelwinkel, Wechselwinkel oder keine Beziehung.</i>"
    answer: "Die markierten Winkel ${:chx==4?'haben':'sind'} <span class='red'>${:chx==0?'Nebenwinkel'::chx==1?'Stufenwinkel'::chx==2?'Scheitelwinkel'::chx==3?'Wechselwinkel':'keine Beziehung'}</span>${:chx==4?' zueinander':''}."
    value: ["${:chx==0?'\\text{Nebenwinkel}'::chx==1?'\\text{Stufenwinkel}'::chx==2?'\\text{Scheitelwinkel}'::chx==3?'\\text{Wechselwinkel}':'\\text{keine Beziehung}'}", "${:chx==0?'Nebenwinkel'::chx==1?'Stufenwinkel'::chx==2?'Scheitelwinkel'::chx==3?'Wechselwinkel':'keine Beziehung'}"]
  - name: Winkel an zwei parallelen Geraden
    consts:
      adj: [[1, 2], [2, 3], [3, 4], [4, 1], [5, 6], [6, 7], [7, 8], [8, 5]]
      supp: [[1, 6], [1, 8], [2, 5], [2, 7], [3, 6], [3, 8], [4, 5], [4, 7]]
      corr: [[1, 5], [2, 6], [3, 7], [4, 8]]
      opp: [[1, 3], [2, 4], [5, 7], [6, 8]]
      alt: [[2, 8], [3, 5]]
    vars:
      chx: "0_4"
      paire: "0_${:chx==0?:adj.length-1::chx==1?:supp.length-1::chx==2?:corr.length-1::chx==3?:opp.length-1::alt.length-1}"
      a1: "${:chx==0?:adj[:paire][0]::chx==1?:supp[:paire][0]::chx==2?:corr[:paire][0]::chx==3?:opp[:paire][0]::alt[:paire][0]}"
      a2: "${:chx==0?:adj[:paire][1]::chx==1?:supp[:paire][1]::chx==2?:corr[:paire][1]::chx==3?:opp[:paire][1]::alt[:paire][1]}"
      ang1: "70_110"
      ang2: "${:ang1}"
    question: "Zwei parallele Geraden werden von einer dritten Geraden geschnitten. Welche Beziehung besteht zwischen den markierten Winkeln?<br><i>Wähle: Nebenwinkel, Supplementwinkel (ergänzen sich zu 180°), Stufenwinkel, Scheitelwinkel, Wechselwinkel oder keine Beziehung.</i>"
    answer: "Die markierten Winkel sind <span class='red'>${:chx==0?'Nebenwinkel'::chx==1?'Supplementwinkel'::chx==2?'Stufenwinkel'::chx==3?'Scheitelwinkel':'Wechselwinkel'}</span>${:chx==1?' (sie ergänzen sich zu 180°)':''}."
    value: ["${:chx==0?'\\text{Nebenwinkel}'::chx==1?'\\text{Supplementwinkel}'::chx==2?'\\text{Stufenwinkel}'::chx==3?'\\text{Scheitelwinkel}':'\\text{Wechselwinkel}'}", "${:chx==0?'Nebenwinkel'::chx==1?'Supplementwinkel'::chx==2?'Stufenwinkel'::chx==3?'Scheitelwinkel':'Wechselwinkel'}"]
figure:
  type: graph
  boundingbox: [-5, 5, 10, -5]
  axis: false
  grid: false
  content:
    - [point, [0, 0], { name: O, visible: false, label: { visible: false } }]
    - [point, [5, 0], { name: O2, visible: false, label: { visible: false } }]
    - [point, [7, 0], { name: A, visible: false, label: { visible: false } }]
    - [
        point,
        [
          "${Math.cos(:ang1*Math.PI/180)*2+5}",
          "${Math.sin(:ang1*Math.PI/180)*2}",
        ],
        { name: B, visible: false, label: { visible: false } },
      ]
    - [
        point,
        [
          "${-Math.cos(:ang1*Math.PI/180)*2+5}",
          "${-Math.sin(:ang1*Math.PI/180)*2}",
        ],
        { name: C, visible: false, label: { visible: false } },
      ]
    - [point, [2, 0], { name: D, visible: false, label: { visible: false } }]
    - [
        point,
        [
          "${Math.cos(:ang2*Math.PI/180)*2}",
          "${Math.sin(:ang2*Math.PI/180)*2}",
        ],
        { name: E, visible: false, label: { visible: false } },
      ]
    - [point, [-2, 0], { name: F, visible: false, label: { visible: false } }]
    - [
        point,
        [
          "${-Math.cos(:ang2*Math.PI/180)*2}",
          "${-Math.sin(:ang2*Math.PI/180)*2}",
        ],
        { name: G, visible: false, label: { visible: false } },
      ]
    - [line, [F, A]]
    - [line, [B, C]]
    - [line, [E, G]]
    - [
        angle,
        [A, O2, B],
        {
          visible: "${[:a1,:a2].includes(1)?1:0}",
          name:a1,
          radius: "${:sizes[0]*0.1}",
          label: { visible: false },
          color: "${:colors[:cc[0]]}",
        },
      ]
    - [
        angle,
        [B, O2, D],
        {
          visible: "${[:a1,:a2].includes(2)?1:0}",
          name:a2,
          radius: "${:sizes[1]*0.1}",
          label: { visible: false },
          color: "${:colors[:cc[1]]}",
        },
      ]
    - [
        angle,
        [D, O2, C],
        {
          visible: "${[:a1,:a2].includes(3)?1:0}",
          name:a3,
          radius: "${:sizes[2]*0.1}",
          label: { visible: false },
          color: "${:colors[:cc[2]]}",
        },
      ]
    - [
        angle,
        [C, O2, A],
        {
          visible: "${[:a1,:a2].includes(4)?1:0}",
          name:a4,
          radius: "${:sizes[3]*0.1}",
          label: { visible: false },
          color: "${:colors[:cc[3]]}",
        },
      ]
    - [
        angle,
        [D, O, E],
        {
          visible: "${[:a1,:a2].includes(5)?1:0}",
          name:a5,
          radius: "${:sizes[4]*0.1}",
          label: { visible: false },
          color: "${:colors[:cc[4]]}",
        },
      ]
    - [
        angle,
        [E, O, F],
        {
          visible: "${[:a1,:a2].includes(6)?1:0}",
          name:a6,
          radius: "${:sizes[5]*0.1}",
          label: { visible: false },
          color: "${:colors[:cc[5]]}",
        },
      ]
    - [
        angle,
        [F, O, G],
        {
          visible: "${[:a1,:a2].includes(7)?1:0}",
          name:a7,
          radius: "${:sizes[6]*0.1}",
          label: { visible: false },
          color: "${:colors[:cc[6]]}",
        },
      ]
    - [
        angle,
        [G, O, D],
        {
          visible: "${[:a1,:a2].includes(8)?1:0}",
          name:a8,
          radius: "${:sizes[7]*0.1}",
          label: { visible: false },
          color: "${:colors[:cc[7]]}",
        },
      ]
