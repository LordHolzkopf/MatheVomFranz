title: "Fehlenden Faktor 10, 100, 1000 ergänzen"
speech: 1
keys: ["_","_","_","_","_","_","_","_"]
description: "Kommaverschiebung, fehlenden Faktor 10, 100 oder 1000 in Gleichungen wie 1200 = 1,2 · … finden, Lücke ergänzen, Stufenzahlen"
dest: [6ED]
options:
  - name: "1 gültige Ziffer, Faktor 10"
    vars:
      a: "1_9"
      p: "-3_3"
      c: "${MMmath.round(:a*Math.pow(10,:p),3)}"
      prod: "${MMmath.round(:c*10,6)}"
    question: ":prod=:c\\times\\, ?"
    shortq: ":prod=:c\\times\\colorbox{#ececec}{\\quad}"
    audio: "${String(:prod).replace('.',',')} ist gleich ${String(:c).replace('.',',')} mal wie viel?"
    answer: ":prod=:c\\times\\color{red}{10}"
    value: 10
