<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="utf-8" />
        <title>Aufgaben-Editor – MatheVomFranz</title>
        <link rel="stylesheet" href="css/editor.css" />
        <link rel="stylesheet" href="js/libs/katex/katex.min.css" />
        <link rel="stylesheet" href="css/mm-katex.css" />
        <script src="js/libs/jsoneditor-9.5.3/dist/jsoneditor.min.js"></script>
        <script src="js/lib.editor.js?v=1" type="module" defer></script>
        <style></style>
    </head>
    <body>
        <head>
            <h1>Aufgaben-Editor für MatheVomFranz</h1>
        </head>
        <section id="affichage">
            <div id="display">
                <div id="param-title-act"></div>
                <div id="activityTitle"></div>
                <div id="voix"></div>
                <div id="activityDescription"></div>
                <div id="activityConsigne"></div>
                <div id="activityOptions"></div>
                <div id="phantom"></div>
                <div id="divparams"></div>
                <div id="errors"></div>
            </div>
            <div id="ide">
                <button id="testBtn" title="Zeigt die Aufgabe an">
                    Anzeigen
                </button>
                <button
                    id="saveBtn"
                    title="Speichert die JSON-Datei auf dem Computer"
                >
                    Herunterladen
                </button>
                <button title="Lädt eine zufällige Aufgabe" id="randomBtn">
                    Zufällig
                </button>
                <input
                    type="text"
                    placeholder="Aufgaben-ID"
                    id="actIDImport"
                    size="8"
                    title="Importiert eine vorhandene Aufgabe über ihre ID"
                />
                <input
                    type="file"
                    id="openFileInput"
                    title="Importiert eine JSON-Datei in den Editor"
                />
            </div>
        </section>
    </body>
</html>
