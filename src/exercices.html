<!doctype html>
<html lang="de" id="thehtml">
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <style>
            /*MMentales*/
            @page {
                size: A4 portrait;
                margin: 0.8cm;
            }
        </style>
        <title>Übungsblatt – MatheVomFranz</title>
        <link rel="stylesheet" href="css/exercices.css?v=5" type="text/css" />
        <link rel="stylesheet" href="js/libs/katex/katex.min.css" />
        <link rel="stylesheet" href="css/mm-katex.css" />
        <script
            type="module"
            src="js/lib.exercices.js?v=2.0.34"
            id="mmscriptid"
        ></script>
    </head>
    <body size="A4">
        <div class="noprint" style="text-align: center">
            <button
                onclick="window.print()"
                title="Drucken oder als PDF speichern"
                style="width: 70pt; height: 18pt"
            >
                🖨️ Drucken
            </button>
            <button
                id="pageOrientation"
                title="Seitenausrichtung ändern"
            >
                Querformat
            </button>
            (Ränder auf null stellen)
        </div>
        <div id="creator-container">
            <section id="creator-menu" class="noprint">
                Schrift: <span id="fontSize"></span> <br /><b>Blätter</b>:
                <input type="number" min="1" id="nbFiches" size="3" />
                <button
                    id="fichesSeparation"
                    title="Blätter auf getrennten Seiten drucken oder nicht"
                >
                    Getrennte Seiten
                </button>
                Spalten:
                <input
                    type="radio"
                    name="columns"
                    value="1"
                    id="columns1"
                    checked
                />
                <label for="columns1"> 1 </label>
                <input type="radio" name="columns" value="2" id="columns2" />
                <label for="columns2"> 2 </label>
                <div id="corriges-params">
                    <b>Lösungen</b>:
                    <input
                        type="radio"
                        name="corriges"
                        value="hidden"
                        id="corriges-hidden"
                        checked
                    />
                    <label for="corriges-hidden">ausgeblendet</label>
                    <input
                        type="radio"
                        name="corriges"
                        value="each"
                        id="corriges-dessous"
                    />
                    <label for="corriges-dessous">unter jeder Aufgabe</label>
                    <input
                        type="radio"
                        name="corriges"
                        value="acote"
                        id="corriges-acote"
                    />
                    <label for="corriges-acote">daneben</label>
                    <input
                        type="radio"
                        name="corriges"
                        value="end"
                        id="corriges-end"
                    />
                    <label for="corriges-end">nach den Aufgaben</label>
                    <input
                        type="radio"
                        name="corriges"
                        value="separe"
                        id="corriges-separe"
                    />
                    <label for="corriges-separe">auf eigenem Blatt</label>
                </div>
            </section>
            <section id="tab-accueil" class="noprint"></section>
            <section id="creator-content"></section>
        </div>
    </body>
</html>
