<!doctype html>
<html lang="de" id="thehtml">
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <style>
            /*MMentales*/
            @page {
                size: A4 portrait;
                margin: 0.8cm;
            }
        </style>
        <title>Testblatt – MatheVomFranz</title>
        <link rel="stylesheet" href="css/exam.css" type="text/css" />
        <link rel="stylesheet" href="js/libs/katex/katex.min.css" />
        <link rel="stylesheet" href="css/mm-katex.css" />
        <script
            type="module"
            src="js/lib.exam.js?v=2.0.34"
            id="mmscriptid"
        ></script>
    </head>
    <body size="A4">
        <div class="noprint" style="text-align: center">
            <button
                onclick="window.print()"
                title="Drucken oder als PDF speichern"
                style="width: 70pt; height: 18pt"
            >
                🖨️ Drucken
            </button>
            <button
                id="pageOrientation"
                title="Seitenausrichtung ändern"
            >
                Querformat
            </button>
            (Ränder auf null stellen)
        </div>
        <div id="creator-container">
            <section id="creator-menu" class="noprint">
                <span class="radios-oui-non">
                    Antwortfeld:
                    <input type="radio" name="encart" value="oui" id="encart-oui" checked />
                    <label for="encart-oui">ja</label>
                    <input type="radio" name="encart" value="non" id="encart-non" />
                    <label for="encart-non">nein</label>
                </span>
                | Blätter:
                <input
                    type="number"
                    min="1"
                    id="nbFiches"
                    size="3"
                    title="Anzahl der Blätter"
                />
                <button
                    id="fichesSeparation"
                    title="Testblätter getrennt oder fortlaufend drucken"
                >
                    Trennen
                </button>
                <span class="radios-oui-non">
                    Fragen mischen:
                    <input type="radio" name="fusion" value="oui" id="fusion-oui" />
                    <label for="fusion-oui">ja</label>
                    <input type="radio" name="fusion" value="non" id="fusion-non" checked />
                    <label for="fusion-non">nein</label>
                </span>
                |
                <span class="radios-oui-non">
                    Lösungen:
                    <input type="radio" name="corrige" value="oui" id="corrige-oui" checked />
                    <label for="corrige-oui">ja</label>
                    <input type="radio" name="corrige" value="non" id="corrige-non" />
                    <label for="corrige-non">nein</label>
                </span>
                <span id="btpCorrigePlace" class="hidden">
                    <span class="radios-oui-non">
                    Seitenumbruch:
                    <input type="radio" name="sautpage" value="oui" id="sautpage-oui" />
                    <label for="sautpage-oui">ja</label>
                    <input type="radio" name="sautpage" value="non" id="sautpage-non" checked />
                    <label for="sautpage-non">nein</label>
                </span>
                </span>
                | Schrift: <span id="fontSize"></span>
            </section>
            <section id="tab-accueil" class="noprint"></section>
            <section id="creator-content"></section>
        </div>
    </body>
</html>
