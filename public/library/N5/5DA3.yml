title: Relative Häufigkeit als Bruch bestimmen
dest: [6FA]
type: text
keys:
  - '/'
textSize: medium
description: >
  Relative Häufigkeit als Bruch aus einem Text, einer Häufigkeitstabelle oder einem Diagramm bestimmen; absolute Häufigkeit, Anteil, Statistik, Säulendiagramm, Kreisdiagramm.
options:
  - name: Relative Häufigkeit aus einem Text
    consts:
      textq:
        - In einer Klasse mit :tout Kindern essen :partie mittags nicht in der Mensa. Wie groß ist die relative Häufigkeit der Kinder, die in der Mensa essen?
        - In einem Sportverein mit :tout Mitgliedern sind :partie Frauen, die übrigen Männer. Wie groß ist die relative Häufigkeit der Männer?
        - In einem Chor mit :tout Mitgliedern singen :partie Sopran. Wie groß ist die relative Häufigkeit der Chormitglieder, die nicht Sopran singen?
        - In einem Regal stehen :tout Bücher, davon sind :partie Romane. Wie groß ist die relative Häufigkeit der Bücher, die keine Romane sind?
        - In einer Firma arbeiten :tout Beschäftigte, davon sind :partie Führungskräfte. Wie groß ist die relative Häufigkeit der Beschäftigten, die keine Führungskräfte sind?
      textr:
        - Kinder, die in der Mensa essen,
        - Männer
        - Chormitglieder, die nicht Sopran singen,
        - Bücher, die keine Romane sind,
        - Beschäftigten, die keine Führungskräfte sind,
    vars:
      tout: "20_30"
      partie: "1_15"
      reste: "${:tout-:partie}"
      choixtext: "0_4"
    question: ${:textq[:choixtext]}
    answer: Die relative Häufigkeit der ${:textr[:choixtext]} beträgt $$\color{red}{\dfrac{:reste}{:tout}}${MMmath.pgcd(:reste,:tout)>1?'=\color{green}{'+MMmath.fractionSimplifiee(:reste,:tout)+'}':''}$$.
    value: \dfrac{:reste}{:tout}
  - name: Relative Häufigkeit aus einer Tabelle, Gesamtzahl gegeben
    consts:
      valeurs:
        - ["Rot", "Blau", "Grün", "Gelb"]
        - ["Äpfel", "Bananen", "Orangen", "Kiwis"]
        - ["Möhren", "Bohnen", "Tomaten", "Salat"]
        - ["Kartoffeln", "Nudeln", "Reis", "Couscous"]
        - ["Hallenfußball", "Basketball", "Volleyball", "Badminton"]
    vars:
      nbvalues: [10, 20, 25, 30, 40, 50, 80, 100]
      v1: "1_${:nbvalues-4}"
      v2: "1_${:nbvalues-3-:v1}"
      v3: "1_${:nbvalues-2-:v1-:v2}"
      v4: "${:nbvalues-:v1-:v2-:v3}"
      pop: ["Schülerinnen und Schülern", "Personen", "Kindern", "Jugendlichen"]
      cxv: "1_4"
      value: ${:cxv==1?:v1::cxv==2?:v2::cxv==3?:v3::v4}
      cxt: "0_4"
      cat: ${:valeurs[:cxt][:cxv-1]}
    question: >
      Bei einer Umfrage unter :nbvalues :pop wurden folgende
      Antworten gegeben:
      <table class="inline-table">
        <tr><th>Antwort</th><th>${:valeurs[:cxt][0]}</th><th>${:valeurs[:cxt][1]}</th><th>${:valeurs[:cxt][2]}</th><th>${:valeurs[:cxt][3]}</th></tr>
        <tr><th>Häufigkeit</th><td>:v1</td><td>:v2</td><td>:v3</td><td>:v4</td></tr>
      </table><br>
      Wie groß ist die relative Häufigkeit der Antwort <b>:cat</b>?
    answer: >
      Die relative Häufigkeit der Antwort „:cat“ beträgt $$\color{red}{\dfrac{:value}{:nbvalues}}${MMmath.pgcd(:value,:nbvalues)>1?'=\color{green}{'+MMmath.fractionSimplifiee(:value,:nbvalues)+'}':''}$$.
    value: \dfrac{:value}{:nbvalues}
  - name: Relative Häufigkeit aus einer Tabelle, Gesamtzahl berechnen
    consts:
      valeurs:
        - ["Rot", "Blau", "Grün", "Gelb"]
        - ["Äpfel", "Bananen", "Orangen", "Kiwis"]
        - ["Möhren", "Bohnen", "Tomaten", "Salat"]
        - ["Kartoffeln", "Nudeln", "Reis", "Couscous"]
        - ["Hallenfußball", "Basketball", "Volleyball", "Badminton"]
    vars:
      nbvalues: [10, 15, 20, 25, 30, 40, 50]
      v1: "1_${:nbvalues-4}"
      v2: "1_${:nbvalues-3-:v1}"
      v3: "1_${:nbvalues-2-:v1-:v2}"
      v4: "${:nbvalues-:v1-:v2-:v3}"
      pop: ["Schülerinnen und Schülern", "Personen", "Kindern", "Jugendlichen"]
      cxv: "1_4"
      value: ${:cxv==1?:v1::cxv==2?:v2::cxv==3?:v3::v4}
      cxt: "0_4"
      cat: ${:valeurs[:cxt][:cxv-1]}
    question: >
      Bei einer Umfrage unter :pop wurden folgende
      Antworten gegeben:
      <table class="inline-table">
        <tr><th>Antwort</th><th>${:valeurs[:cxt][0]}</th><th>${:valeurs[:cxt][1]}</th><th>${:valeurs[:cxt][2]}</th><th>${:valeurs[:cxt][3]}</th></tr>
        <tr><th>Häufigkeit</th><td>:v1</td><td>:v2</td><td>:v3</td><td>:v4</td></tr>
      </table><br>
      Wie groß ist die relative Häufigkeit der Antwort <b>:cat</b>?
    answer: >
      Die relative Häufigkeit der Antwort „:cat“ beträgt $$\color{red}{\dfrac{:value}{:nbvalues}}${MMmath.pgcd(:value,:nbvalues)>1?'=\color{green}{'+MMmath.fractionSimplifiee(:value,:nbvalues)+'}':''}$$.
    value:
      - \dfrac{:value}{:nbvalues}
      - ${MMmath.fractionSimplifiee(:value,:nbvalues)}
  - name: Relative Häufigkeit aus einem Diagramm
    consts:
      valeurs:
        - ["Rot", "Blau", "Grün", "Gelb"]
        - ["Äpfel", "Bananen", "Orangen", "Kiwis"]
        - ["Möhren", "Bohnen", "Tomaten", "Salat"]
        - ["Kartoffeln", "Nudeln", "Reis", "Couscous"]
        - ["Hallenfußball", "Basketball", "Volleyball", "Badminton"]
      titres:
        - "Lieblingsfarben"
        - "Lieblingsobst"
        - "Lieblingsgemüse"
        - "Lieblingsbeilagen"
        - "Lieblings-Hallensportarten"
    vars:
      nbvalues: [10, 15, 20, 25, 30, 40, 50]
      v1: "1_${:nbvalues-4}"
      v2: "1_${:nbvalues-3-:v1}"
      v3: "1_${:nbvalues-2-:v1-:v2}"
      v4: "${:nbvalues-:v1-:v2-:v3}"
      pop: ["Schülerinnen und Schülern", "Personen", "Kindern", "Jugendlichen"]
      cxv: "1_4"
      value: ${:cxv==1?:v1::cxv==2?:v2::cxv==3?:v3::v4}
      cxt: "0_4"
      cat: ${:valeurs[:cxt][:cxv-1]}
      type: ["vertical", "pie"]
    figure:
      type: chart
      content:
        type: ${:type}
        labels:
          [
            "${:valeurs[:cxt][0]}",
            "${:valeurs[:cxt][1]}",
            "${:valeurs[:cxt][2]}",
            "${:valeurs[:cxt][3]}",
          ]
        data: [":v1", ":v2", ":v3", ":v4"]
        options:
          {
            title: "${:titres[:cxt]}",
            colors: ["#3e95cd", "#8e5ea2", "#3cba9f", "#e8c3b9"],
            showLegend: true,
          }
    question: >
      Wie groß ist die relative Häufigkeit der Antwort „:cat“?
    answer: >
      Die relative Häufigkeit der Antwort „:cat“ beträgt $$\color{red}{\dfrac{:value}{:nbvalues}}${MMmath.pgcd(:value,:nbvalues)>1?'=\color{green}{'+MMmath.fractionSimplifiee(:value,:nbvalues)+'}':''}$$.
    value: \dfrac{:value}{:nbvalues}
