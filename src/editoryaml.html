<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAML-Aufgaben-Editor – MatheVomFranz</title>
    <link rel="stylesheet" href="css/editoryaml.css">
    <link rel="stylesheet" href="js/libs/katex/katex.min.css" />
    <link rel="stylesheet" href="css/mm-katex.css" />
    <script src="js/lib.editoryaml.js?v=1" type="module" defer></script>
</head>
<body>
<div style="display:flex; width:100%;height: calc( 100vh - 50px);">
    <div id="input" style="width:50%; height: 100%;">
        <h2>Aufgaben-Editor für MatheVomFranz (YAML)</h2>
        <button id="testBtn" title="Zeigt die Aufgabe an">Anzeigen</button>
        <button id="saveBtn" title="Speichert die Datei auf dem Computer">Herunterladen</button>
        <button title="Lädt eine zufällige Aufgabe" id="randomBtn">Zufällig</button>
        <input type="text" placeholder="Aufgaben-ID" id="actIDImport" size="8" title="Importiert eine vorhandene Aufgabe über ihre ID">
        <input type="file" id="openFileInput" title="Importiert eine JSON- oder YAML-Datei in den Editor"><br>
        <textarea id="inputTextArea">title: Titel der Aufgabe
type: text oder latex
dest: [chap1, chap2, ...]
speech: 1 # die Fragen werden so vorgelesen, wie sie dastehen – außer Sie legen mit audio fest, was gelesen werden soll

consts: # global verwendete Konstanten.
# Achtung: Enthalten sie Variablen, müssen diese Variablen in allen Varianten (options) definiert sein
  name1: Werte
  name2: Werte
vars: # globale Variablen, in allen Varianten verfügbar
  v1: Wert
  v2: Wert
options:
  - name: ein Text, der die Variante beschreibt
    vars:
      v3: Wert # keine Namen verwenden, die schon bei den Konstanten oder globalen Variablen vorkommen
      v4: Wert
    question: ein Text oder eine Formel – das, was gefragt wird
    answer: :question übernimmt die Frage
    shortq: Kurzfassung der Frage
    audio: der Text zum Vorlesen, der die Frage wiedergibt
    value: der erwartete kurze Wert für die Gürtel oder die Online-Version. # fehlt er, wird vermutlich answer verwendet
</textarea>
    </div>
    <div style="width:50%">
        <h2>Vorschau</h2>
            <section id="result">
                <div id="display">
                <div id="param-title-act"></div>
                <div id="activityTitle"></div>
                <div id="voix"></div>
                <div id="activityDescription"></div>
                <div id="activityConsigne"></div>
                <div id="activityOptions"></div>
                <div id="phantom"></div>
                <div id="divparams"></div>
                <div id="errors"></div>
            </section>
        </div>
    </div>
</div>
</body>
</html>
