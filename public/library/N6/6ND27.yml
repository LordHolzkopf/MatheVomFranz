title: Kleines Einmaleins (ohne 0 und 1)
dest: [WAB, 5AC]
description: Einmaleins, Einmaleinsreihen von 2 bis 12 in verschiedenen Formen, Malaufgaben, Aufgaben mit Lücke, Geteiltaufgaben, Umkehraufgaben
type: latex # pas obligatoire, c'est la valeur par défaut
params: # Kästchen zum Ankreuzen: Werte des 2. Faktors, die nicht abgefragt werden
  n2: {groupe: Nicht abfragen, label: "2", defaut: false, exclut: {m: 2}}
  n3: {groupe: Nicht abfragen, label: "3", defaut: false, exclut: {m: 3}}
  n4: {groupe: Nicht abfragen, label: "4", defaut: false, exclut: {m: 4}}
  n5: {groupe: Nicht abfragen, label: "5", defaut: false, exclut: {m: 5}}
  n6: {groupe: Nicht abfragen, label: "6", defaut: false, exclut: {m: 6}}
  n7: {groupe: Nicht abfragen, label: "7", defaut: false, exclut: {m: 7}}
  n8: {groupe: Nicht abfragen, label: "8", defaut: false, exclut: {m: 8}}
  n9: {groupe: Nicht abfragen, label: "9", defaut: false, exclut: {m: 9}}
  n10: {groupe: Nicht abfragen, label: "10", defaut: false, exclut: {m: 10}}
options:
  - name: Zweierreihe
    vars:
      m: '2_10'
      n: 2
      r: ${2*:m}
  - name: Dreierreihe
    vars:
      m: '2_10'
      n: 3
      r: ${3*:m}
  - name: Viererreihe
    vars:
      m: '2_10'
      n: 4
      r: ${4*:m}
  - name: Fünferreihe
    vars:
      m: '2_10'
      n: 5
      r: ${5*:m}
  - name: Sechserreihe
    vars:
      m: '2_10'
      n: 6
      r: ${6*:m}
  - name: Siebenerreihe
    vars:
      m: '2_10'
      n: 7
      r: ${7*:m}
  - name: Achterreihe
    vars:
      m: '2_10'
      n: 8
      r: ${8*:m}
  - name: Neunerreihe
    vars:
      m: '2_10'
      n: 9
      r: ${9*:m}
  - name: Zehnerreihe
    vars:
      m: '2_10'
      n: 10
      r: ${10*:m}
  - name: Elferreihe
    vars:
      m: '2_10'
      n: 11
      r: ${11*:m}
  - name: Zwölferreihe
    vars:
      m: '2_10'
      n: 12
      r: ${12*:m}
question: # forme de question commune à toutes les options
  - :n\times:m=?
  - :m\times:n=?
  - :r = :n\times ?
  - :r\div:n=?
shortq:
  - :n\times:m
  - :m\times:n
  - :r = :n\times ?
  - :r\div:n
answer: # à chaque question sa réponse
  - :n\times:m=\color{red}{:r}
  - :m\times:n=\color{red}{:r}
  - :r = :n\times \color{red}{:m}
  - :r\div:n=\color{red}{:m}
value: # à chaque question la valeur attendue pour évaluation ou pour les réponses courtes dans les ceintures
  - :r
  - :r
  - :m
  - :m