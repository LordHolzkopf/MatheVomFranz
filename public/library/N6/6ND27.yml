title: Tables de multiplication classiques (sans 0 et 1)
dest: [WAB, 5AC]
description: Connaitre les tables de multiplications de 2 à 12, sous plusieurs formes
type: latex # pas obligatoire, c'est la valeur par défaut
params: # cases à cocher : valeurs du 2e facteur à ne pas tirer
  n2: {groupe: Ne pas tirer, label: "2", defaut: false, exclut: {m: 2}}
  n3: {groupe: Ne pas tirer, label: "3", defaut: false, exclut: {m: 3}}
  n4: {groupe: Ne pas tirer, label: "4", defaut: false, exclut: {m: 4}}
  n5: {groupe: Ne pas tirer, label: "5", defaut: false, exclut: {m: 5}}
  n6: {groupe: Ne pas tirer, label: "6", defaut: false, exclut: {m: 6}}
  n7: {groupe: Ne pas tirer, label: "7", defaut: false, exclut: {m: 7}}
  n8: {groupe: Ne pas tirer, label: "8", defaut: false, exclut: {m: 8}}
  n9: {groupe: Ne pas tirer, label: "9", defaut: false, exclut: {m: 9}}
  n10: {groupe: Ne pas tirer, label: "10", defaut: false, exclut: {m: 10}}
options:
  - name: Table de 2
    vars:
      m: '2_10'
      n: 2
      r: ${2*:m}
  - name: Table de 3
    vars:
      m: '2_10'
      n: 3
      r: ${3*:m}
  - name: Table de 4
    vars:
      m: '2_10'
      n: 4
      r: ${4*:m}
  - name: Table de 5
    vars:
      m: '2_10'
      n: 5
      r: ${5*:m}
  - name: Table de 6
    vars:
      m: '2_10'
      n: 6
      r: ${6*:m}
  - name: Table de 7
    vars:
      m: '2_10'
      n: 7
      r: ${7*:m}
  - name: Table de 8
    vars:
      m: '2_10'
      n: 8
      r: ${8*:m}
  - name: Table de 9
    vars:
      m: '2_10'
      n: 9
      r: ${9*:m}
  - name: Table de 10
    vars:
      m: '2_10'
      n: 10
      r: ${10*:m}
  - name: Table de 11
    vars:
      m: '2_10'
      n: 11
      r: ${11*:m}
  - name: Table de 12
    vars:
      m: '2_10'
      n: 12
      r: ${12*:m}
question: # forme de question commune à toutes les options
  - :n\times:m=?
  - :m\times:n=?
  - :r = :n\times ?
  - :r\div:n=?
shortq:
  - :n\times:m
  - :m\times:n
  - :r = :n\times ?
  - :r\div:n
answer: # à chaque question sa réponse
  - :n\times:m=\color{red}{:r}
  - :m\times:n=\color{red}{:r}
  - :r = :n\times \color{red}{:m}
  - :r\div:n=\color{red}{:m}
value: # à chaque question la valeur attendue pour évaluation ou pour les réponses courtes dans les ceintures
  - :r
  - :r
  - :m
  - :m