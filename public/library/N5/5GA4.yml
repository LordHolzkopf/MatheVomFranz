title: Körper auf Fotos erkennen
description: Grundkörper auf Fotos und Abbildungen erkennen – Würfel, Quader, Zylinder, Kegel, Prisma mit dreieckiger, fünfeckiger oder sechseckiger Grundfläche, Pyramide mit dreieckiger oder quadratischer Grundfläche, Kugel; Körper in der Umwelt.
type: text
ID: 5GA4
repeat: 2
dest: [5EA]
consts:
  photosCubePave:
    - ["cube-rubiks.webp", "ein Würfel"]
    - ["cube-dice.webp", "ein Würfel"]
    - ["cube-building.webp", "ein Würfel"]
    - ["cube-illustration.webp", "ein Würfel"]
    - ["pave-brique.webp", "ein Quader"]
    - ["pave-carton.webp", "ein Quader"]
    - ["pave-immeuble.webp", "ein Quader"]
    - ["pave-illustration.webp", "ein Quader"]
  photosCylindrePrisme:
    - ["cylindre-canette.webp", "ein Zylinder"]
    - ["cylindre-tuyau.webp", "ein Zylinder"]
    - ["cylindre-silo.webp", "ein Zylinder"]
    - ["cylindre-illustration.webp", "ein Zylinder"]
    - ["prismetri-toblerone.webp", "ein dreiseitiges Prisma"]
    - ["prismetri-tente.webp", "ein dreiseitiges Prisma"]
    - ["prismetri-toit.webp", "ein dreiseitiges Prisma"]
    - ["prismetri-illustration.webp", "ein dreiseitiges Prisma"]
    - ["prismepenta-pentagon.webp", "ein fünfseitiges Prisma"]
    - ["prismepenta-kiosque.webp", "ein fünfseitiges Prisma"]
    - ["prismehexa-ecrou.webp", "ein sechsseitiges Prisma"]
    - ["prismehexa-kiosque.webp", "ein sechsseitiges Prisma"]
  photosPyramideCone:
    - ["pyramidetri-tetrapak.webp", "eine dreiseitige Pyramide"]
    - ["pyramidetri-sculpture.webp", "eine dreiseitige Pyramide"]
    - ["pyramidetri-illustration.webp", "eine dreiseitige Pyramide"]
    - ["pyramidecarree-gizeh.webp", "eine quadratische Pyramide"]
    - ["pyramidecarree-louvre.webp", "eine quadratische Pyramide"]
    - ["pyramidecarree-encens.webp", "eine quadratische Pyramide"]
    - ["pyramidecarree-illustration.webp", "eine quadratische Pyramide"]
    - ["cone-signalisation.webp", "ein Kegel"]
    - ["cone-glace.webp", "ein Kegel"]
    - ["cone-tipi.webp", "ein Kegel"]
    - ["cone-illustration.webp", "ein Kegel"]
  photosBouleSphere:
    - ["boule-petanque.webp", "eine Kugel", "der Körper ist innen ausgefüllt (Vollkugel)", "Vollkugel"]
    - ["boule-bille.webp", "eine Kugel", "der Körper ist innen ausgefüllt (Vollkugel)", "Vollkugel"]
    - ["boule-illustration.webp", "eine Kugel", "der Körper ist innen ausgefüllt (Vollkugel)", "Vollkugel"]
    - ["sphere-ballon.webp", "eine Kugel", "der Körper ist innen hohl (Hohlkugel), es zählt nur die Oberfläche", "Hohlkugel"]
    - ["sphere-noel.webp", "eine Kugel", "der Körper ist innen hohl (Hohlkugel), es zählt nur die Oberfläche", "Hohlkugel"]
    - ["sphere-illustration.webp", "eine Kugel", "der Körper ist innen hohl (Hohlkugel), es zählt nur die Oberfläche", "Hohlkugel"]
options:
  - name: Würfel oder Quader
    vars:
      idx: "0_${:photosCubePave.length-1}"
      fichier: "library/illustrations/5GA4/${:photosCubePave[:idx][0]}"
      rep: ${:photosCubePave[:idx][1]}
    question: Welcher Körper ist auf dem Bild zu sehen?
    shortq: Welcher Körper?
    figure:
      type: img
      content: <img src="${:fichier}" alt="" style="max-width:100%;max-height:14em;border-radius:0.3em;">
    answer: Das ist <span class="red">${:rep}</span>.
    value: ["${:rep}", "${:rep.replace(/^(ein|eine) /, '')}"]
  - name: Zylinder oder Prisma
    vars:
      idx: "0_${:photosCylindrePrisme.length-1}"
      fichier: "library/illustrations/5GA4/${:photosCylindrePrisme[:idx][0]}"
      rep: ${:photosCylindrePrisme[:idx][1]}
    question: Welcher Körper ist auf dem Bild zu sehen?
    shortq: Welcher Körper?
    figure:
      type: img
      content: <img src="${:fichier}" alt="" style="max-width:100%;max-height:14em;border-radius:0.3em;">
    answer: Das ist <span class="red">${:rep}</span>.
    value: ["${:rep}", "${:rep.replace(/^(ein|eine) /, '')}"]
  - name: Pyramide oder Kegel
    vars:
      idx: "0_${:photosPyramideCone.length-1}"
      fichier: "library/illustrations/5GA4/${:photosPyramideCone[:idx][0]}"
      rep: ${:photosPyramideCone[:idx][1]}
    question: Welcher Körper ist auf dem Bild zu sehen?
    shortq: Welcher Körper?
    figure:
      type: img
      content: <img src="${:fichier}" alt="" style="max-width:100%;max-height:14em;border-radius:0.3em;">
    answer: Das ist <span class="red">${:rep}</span>.
    value: ["${:rep}", "${:rep.replace(/^(ein|eine) /, '')}"]
  - name: Kugel (Vollkugel oder Hohlkugel)
    vars:
      idx: "0_${:photosBouleSphere.length-1}"
      fichier: "library/illustrations/5GA4/${:photosBouleSphere[:idx][0]}"
      rep: ${:photosBouleSphere[:idx][1]}
      precision: ${:photosBouleSphere[:idx][2]}
      art: ${:photosBouleSphere[:idx][3]}
    question: Welcher Körper ist auf dem Bild zu sehen?
    shortq: Welcher Körper?
    figure:
      type: img
      content: <img src="${:fichier}" alt="" style="max-width:100%;max-height:14em;border-radius:0.3em;">
    answer: "Das ist <span class=\"red\">${:rep}</span>: ${:precision}."
    value: ["Kugel", "eine Kugel", "${:art}"]
