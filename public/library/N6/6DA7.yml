title: Säulen- und Kreisdiagramme ablesen
description: "Säulendiagramm, Balkendiagramm, Kreisdiagramm, Diagramm ablesen, Häufigkeit, Umfrage, Daten, Statistik"
dest: [6FB, 5AG]
type: text
consigne: In einer Gruppe wurde eine Umfrage gemacht.
consts:
  valeurs:
    - ["Rot", "Blau", "Grün", "Gelb"]
    - ["Äpfel", "Bananen", "Orangen", "Kiwis"]
    - ["Möhren", "Bohnen", "Tomaten", "Salat"]
    - ["Kartoffeln", "Nudeln", "Reis", "Couscous"]
    - ["Hallenfußball", "Basketball", "Volleyball", "Badminton"]
  titres:
    - "Lieblingsfarben"
    - "Lieblingsobst"
    - "Lieblingsgemüse"
    - "Lieblingsbeilagen"
    - "Lieblings-Hallensportarten"
options:
  - name: Säulendiagramm ablesen
    vars:
      nbvalues: [10, 15, 20, 25, 30, 40, 50]
      v1: "1_${:nbvalues-4}"
      v2: "1_${:nbvalues-3-:v1}"
      v3: "1_${:nbvalues-2-:v1-:v2}"
      v4: "${:nbvalues-:v1-:v2-:v3}"
      pop: ["Schülerinnen und Schülern", "Personen", "Kindern", "Jugendlichen"]
      cxv: "1_4"
      value: ${:cxv==1?:v1::cxv==2?:v2::cxv==3?:v3::v4}
      cxt: "0_4"
      cat: ${:valeurs[:cxt][:cxv-1]}
      article: "${:cxt==0||:cxt==4||(:cxt==3&&:cxv==3)?'le'::cxt==3&&:cxv==4?'la':'les'}"
    figure:
      type: chart
      content:
        type: vertical
        labels:
          [
            "${:valeurs[:cxt][0]}",
            "${:valeurs[:cxt][1]}",
            "${:valeurs[:cxt][2]}",
            "${:valeurs[:cxt][3]}",
          ]
        data: [":v1", ":v2", ":v3", ":v4"]
        options:
          {
            title: "${:titres[:cxt]}",
            colors: ["#3e95cd", "#8e5ea2", "#3cba9f", "#e8c3b9"],
            showLegend: true,
          }
  - name: Kreisdiagramm ablesen
    vars:
      nbvalues: [10, 15, 20, 25, 30, 40, 50]
      v1: "1_${:nbvalues-4}"
      v2: "1_${:nbvalues-3-:v1}"
      v3: "1_${:nbvalues-2-:v1-:v2}"
      v4: "${:nbvalues-:v1-:v2-:v3}"
      pop: ["Schülerinnen und Schülern", "Personen", "Kindern", "Jugendlichen"]
      cxv: "1_4"
      value: ${:cxv==1?:v1::cxv==2?:v2::cxv==3?:v3::v4}
      cxt: "0_4"
      cat: ${:valeurs[:cxt][:cxv-1]}
      article: "${:cxt==0||:cxt==4||(:cxt==3&&:cxv==3)?'le'::cxt==3&&:cxv==4?'la':'les'}"
    figure:
      type: chart
      content:
        type: pie
        labels:
          [
            "${:valeurs[:cxt][0]}",
            "${:valeurs[:cxt][1]}",
            "${:valeurs[:cxt][2]}",
            "${:valeurs[:cxt][3]}",
          ]
        data: [":v1", ":v2", ":v3", ":v4"]
        options:
          {
            title: "${:titres[:cxt]}",
            colors: ["#3e95cd", "#8e5ea2", "#3cba9f", "#e8c3b9"],
            showLegend: true,
          }
question: >
  Wie viele Personen haben „:cat“ gewählt?
answer: >
  $$\color{red}{:value}$$ ${:value==1?'Person hat':'Personen haben'} „:cat“ gewählt.
value: :value
