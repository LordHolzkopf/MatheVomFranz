title: Ganze Zahlen vergleichen
description: "vergleichen, ordnen, ganze Zahlen, negative Zahlen, positive Zahlen, kleiner, größer, Betrag, Gegenzahl, Abstand von null, <, >"
dest: [6GD, 7AA]
type: text
repeat: 2
keys: ["V", "F", "<", ">", "=", "_", "_", "_"]
consts:
  voc: ["kleinste", "größte"]
  dist: ["näher an null", "weiter von null entfernt"]
options:
  - name: Verschiedene Vorzeichen
    vars:
      siga: [-1, 1]
      sigb: "${:siga*(-1)}"
      vaa: "1_20"
      vab: "1_20"
      a: "${:siga*(:vaa)}"
      b: "${:sigb*(:vab)}"
    question: Vergleiche die Zahlen $$:a$$ und $$:b$$.
    answer: $$:a\color{red}{${:a<:b?'<':'>'}}:b$$
    value:
      - ${:a<:b?'<':'>'}
      - ${:a<:b?'\lt':'\gt'}
  - name: Gleiche Vorzeichen
    vars:
      siga: [-1, 1]
      vaa: "1_20"
      vab: "1_20"
      a: "${:siga*(:vaa)}"
      b: "${:siga*(:vab)}"
    question: Vergleiche die Zahlen $$:a$$ und $$:b$$.
    answer: $$:a\color{red}{${:a<:b?'<'::a==:b?'=':'>'}}:b$$
    value:
      - ${:a<:b?'<'::a==:b?'=':'>'}
      - ${:a<:b?'\lt'::a==:b?'=':'\gt'}
  - name: Mit null vergleichen
    vars:
      siga: [-1, 1]
      vaa: "1_20"
      n: "${:siga*(:vaa)}"
      cote: [0, 1]
      a: "${:cote?0::n}"
      b: "${:cote?:n:0}"
    question: Vergleiche die Zahlen $$:a$$ und $$:b$$.
    answer: $$:a\color{red}{${:a<:b?'<':'>'}}:b$$
    value:
      - ${:a<:b?'<':'>'}
      - ${:a<:b?'\lt':'\gt'}
  - name: Negative Zahlen
    vars:
      vaa: "1_20"
      vab: "1_20"
      a: "${-:vaa}"
      b: "${-:vab}"
    question: Vergleiche die Zahlen $$:a$$ und $$:b$$.
    answer: $$:a\color{red}{${:a<:b?'<'::a==:b?'=':'>'}}:b$$
    value:
      - ${:a<:b?'<'::a==:b?'=':'>'}
      - ${:a<:b?'\lt'::a==:b?'=':'\gt'}
  - name: Gegenzahlen
    vars:
      siga: [-1, 1]
      vaa: "1_20"
      a: "${:siga*(:vaa)}"
      b: "${-:siga*(:vaa)}"
    question: Vergleiche die Zahlen $$:a$$ und $$:b$$.
    answer: $$:a\color{red}{${:a<:b?'<':'>'}}:b$$
    value:
      - ${:a<:b?'<':'>'}
      - ${:a<:b?'\lt':'\gt'}
  - name: Schreibweise erst vereinfachen
    vars:
      s1a: [-1, 1]
      s2a: [-1, 1]
      s1b: [-1, 1]
      s2b: [-1, 1]
      vaa: "1_20"
      vab: "1_20"
      a: "${:s1a*:s2a*:vaa}"
      b: "${:s1b*:s2b*:vab}"
      eca: "${(:s1a<0?'-':'+')+'('+(:s2a<0?'-':'+')+:vaa+')'}"
      ecb: "${(:s1b<0?'-':'+')+'('+(:s2b<0?'-':'+')+:vab+')'}"
    question: Vergleiche die Zahlen $$:eca$$ und $$:ecb$$.
    answer: $$:eca\color{red}{${:a<:b?'<'::a==:b?'=':'>'}}:ecb$$, denn $$:eca=:a$$ und $$:ecb=:b$$.
    value:
      - ${:a<:b?'<'::a==:b?'=':'>'}
      - ${:a<:b?'\lt'::a==:b?'=':'\gt'}
  - name: "Wahr oder falsch"
    vars:
      siga: [-1, 1]
      sigb: [-1, 1]
      vaa: "1_20"
      vab: "1_20"
      a: "${:siga*(:vaa)}"
      b: "${:sigb*(:vab)}"
      sens: [0, 1]
      symb: "${:sens?'>':'<'}"
      juste: "${:sens?:a>:b::a<:b}"
    question: Ist diese Aussage wahr oder falsch? $$:a :symb :b$$
    answer: Die Aussage $$:a :symb :b$$ ist <b class='red'>${:juste?'wahr':'falsch'}</b>.
    value:
      - ${:juste?'\text{wahr}':'\text{falsch}'}
      - ${:juste?'wahr':'falsch'}
  - name: Abstand von null vergleichen (Betrag)
    vars:
      siga: [-1, 1]
      sigb: [-1, 1]
      vaa: "1_20"
      vab: "1_20_^${:vaa}"
      a: "${:siga*(:vaa)}"
      b: "${:sigb*(:vab)}"
      cv: "0_1"
    question: Welche der Zahlen $$:a$$ und $$:b$$ liegt ${:dist[:cv]}?
    answer: $$\color{red}{${(:cv?:vaa>:vab::vaa<:vab)?:a::b}}$$ liegt ${:dist[:cv]}.
    value: ${(:cv?:vaa>:vab::vaa<:vab)?:a::b}
  - name: Kleinste/größte von drei Zahlen
    vars:
      a: "-20_20"
      b: "-20_20_^${:a}"
      c: "-20_20_^${:a},${:b}"
      cv: "0_1"
    question: Welche der Zahlen $$:a$$, $$:b$$ und $$:c$$ ist die ${:voc[:cv]}?
    answer: Die ${:voc[:cv]} der Zahlen $$:a$$, $$:b$$ und $$:c$$ ist $$\color{red}{${:cv?Math.max(:a,:b,:c):Math.min(:a,:b,:c)}}$$.
    value: ${:cv?Math.max(:a,:b,:c):Math.min(:a,:b,:c)}
