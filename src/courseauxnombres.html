<!doctype html>
<html lang="de" id="thehtml">
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <style>
            /*MMentales*/
            @page {
                size: A4 portrait;
                margin: 0.8cm;
            }
        </style>
        <title>Zahlenrennen – MatheVomFranz</title>
        <link
            rel="stylesheet"
            href="css/courseauxnombres.css"
            type="text/css"
        />
        <link rel="stylesheet" href="js/libs/katex/katex.min.css" />
        <link rel="stylesheet" href="css/mm-katex.css" />
        <script
            type="module"
            src="js/lib.courseauxnombres.js?v=2.0.34"
            id="mmscriptid"
        ></script>
    </head>
    <body size="A4">
        <button
            onclick="
                document
                    .getElementById('creator-menu')
                    .classList.toggle('hidden')
            "
            class="noprint"
            style="position: absolute; left: 0; top: 0"
            title="Menü anzeigen"
        >
            🛠 Seitenlayout
        </button>
        <button
            onclick="window.print()"
            class="noprint"
            style="position: absolute; left: 110px; top: 0"
            title="Drucken oder als PDF speichern"
        >
            🖨️ Drucken
        </button>
        <div id="creator-container">
            <section id="creator-menu" class="noprint hidden">
                <button
                    id="pageOrientation"
                    title="Seitenausrichtung ändern"
                >
                    Querformat
                </button>
                | Blätter:
                <input type="number" min="1" id="nbFiches" size="3" />
                | Kopfbereich:
                <button id="btnedit" title="Kopfbereich des ersten Blatts bearbeiten">
                    bearbeiten
                </button>
                <button
                    id="btncopy"
                    title="Änderungen auf alle Blätter übertragen"
                >
                    übertragen
                </button>
                |
                <button
                    title="Reihenfolge der Fragen mischen"
                    id="btnshuffle"
                >
                    Mischen
                </button>
                <button
                    id="btneditcontent"
                    title="Inhalt der Tabellen bearbeiten"
                >
                    Inhalt bearbeiten
                </button>
                | Schrift:
            </section>
            <section id="tab-accueil" class="noprint"></section>
            <section id="creator-content"></section>
        </div>
    </body>
</html>
