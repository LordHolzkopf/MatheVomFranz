title: Einfache Brüche als Dezimalzahl kennen
description: Dezimalwert von 1/2, 1/4, 3/4, Halbe, Viertel, Dreiviertel, Brüche und Dezimalzahlen, Beziehungen zu 1
dest: [6BC]
type: text
options:
  - name: Dezimalwert
    consts:
      fractions: [[1, 2], [1, 4], [3, 4], [3, 2], [4, 2], [5, 2]]
      valeurs: [0.5, 0.25, 0.75, 1.5, 2, 2.5]
    vars:
      cxf: "0_${:fractions.length-1}"
      fraction: \dfrac{${:fractions[:cxf][0]}}{${:fractions[:cxf][1]}}
    question: Schreibe $$:fraction$$ als Dezimalzahl.
    answer: $$:fraction=\color{red}{${:valeurs[:cxf]}}$$
    value: "${:valeurs[:cxf]}"
  - name: Beziehungen zwischen Brüchen und 1
    consts:
      operations:
        [
          \dfrac12+\dfrac12,
          \dfrac14+\dfrac14,
          1-\dfrac14,
          \dfrac34-\dfrac14,
          \dfrac12+\dfrac14,
          \dfrac34+\dfrac14,
        ]
      valeurs: [1, \dfrac12, \dfrac34, \dfrac12, \dfrac34, 1]
    vars:
      cxo: "0_${:operations.length-1}"
      operation: ${:operations[:cxo]}
    question: Berechne $$:operation$$.
    answer: $$:operation=\color{red}{${:valeurs[:cxo]}}$$
    value: "${:valeurs[:cxo]}"
