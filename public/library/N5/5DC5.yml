title: Proportionalität am Graphen erkennen
description: >
  proportionale Zuordnung am Graphen erkennen: Ursprungsgerade, Punkte auf einer Geraden durch den Ursprung, Koordinatensystem, Werte am Graphen ablesen
dest: [7BB, 8BB]
type: text
textSize: medium
repeat: 2
keys: ["o", "n", "_", "_"]
consts:
  contextes:
    [
      [
        "Zeit (min)",
        "Strecke (km)",
        "Ist die zurückgelegte Strecke proportional zur Zeit?",
      ],
      [
        "Masse (kg)",
        "Preis (€)",
        "Ist der Preis proportional zur gekauften Masse?",
      ],
      [
        "Dauer (h)",
        "Volumen (L)",
        "Ist das Wasservolumen proportional zur Füllzeit?",
      ],
      [
        "Anzahl Tickets",
        "Preis (€)",
        "Ist der Preis proportional zur Anzahl der Tickets?",
      ],
    ]
  # [x-Achse, y-Achse,
  #  Frage x → y, Einheit von x, Frage y → x, Einheit von y]
  lectures:
    [
      [
        "Zeit (min)",
        "Strecke (km)",
        "Welche Strecke schafft man in",
        "min",
        "Wie lange braucht man für",
        "km",
      ],
      [
        "Anzahl Personen",
        "Pizzastücke",
        "Wie viele Pizzastücke braucht man für",
        "Personen",
        "Für wie viele Personen reichen",
        "Pizzastücke",
      ],
      [
        "Anzahl Verkäufe",
        "Prämie (€)",
        "Welche Prämie bekommt man für",
        "Verkäufe",
        "Wie viele Verkäufe braucht man für eine Prämie von",
        "€",
      ],
      [
        "Dauer (min)",
        "Volumen (L)",
        "Wie viel Wasser fließt innerhalb von",
        "min",
        "Wie lange braucht man zum Auffangen von",
        "L",
      ],
    ]
options:
  - name: Einzelne Punkte
    vars:
      prop: [0, 1]
      cas: "1_3"
      a: [0.5, 1, 1.5]
      b: [1, 2]
      k: "2_4"
      d: [-1, 1]
      y1: "${:prop==1 ? :a : :cas==1 ? :a+:b : :cas==2 ? (:k==1 ? :a+:d : :a) : 0.5}"
      y2: "${:prop==1 ? :a*2 : :cas==1 ? :a*2+:b : :cas==2 ? (:k==2 ? :a*2+:d : :a*2) : 2}"
      y3: "${:prop==1 ? :a*3 : :cas==1 ? :a*3+:b : :cas==2 ? (:k==3 ? :a*3+:d : :a*3) : 4.5}"
      y4: "${:prop==1 ? :a*4 : :cas==1 ? :a*4+:b : :cas==2 ? (:k==4 ? :a*4+:d : :a*4) : 8}"
    figure:
      type: graph
      scale: 3
      boundingbox: [-1, 9, 5.5, -1]
      keepAspect: false
      axis: true
      grid: true
      content:
        - [point, [1, "${:y1}"], { face: "x", size: 4, strokeWidth: 2, withLabel: false, fixed: true }]
        - [point, [2, "${:y2}"], { face: "x", size: 4, strokeWidth: 2, withLabel: false, fixed: true }]
        - [point, [3, "${:y3}"], { face: "x", size: 4, strokeWidth: 2, withLabel: false, fixed: true }]
        - [point, [4, "${:y4}"], { face: "x", size: 4, strokeWidth: 2, withLabel: false, fixed: true }]
    question: Gehört diese Darstellung zu einer proportionalen Zuordnung?
    answer: "${:prop==1 ? '<b>Ja</b>: Die Punkte liegen auf einer Geraden <b>durch den Ursprung</b>.' : :cas==1 ? '<b>Nein</b>: Die Punkte liegen zwar auf einer Geraden, diese geht aber nicht durch den Ursprung.' : '<b>Nein</b>: Die Punkte liegen nicht auf einer Geraden.'}"
    value: ["${:prop==1 ? '\\text{ja}' : '\\text{nein}'}", "${:prop==1 ? 'ja' : 'nein'}", "${:prop==1 ? 'Ja' : 'Nein'}"]
  - name: Durchgezogener Graph
    vars:
      prop: [0, 1]
      cas: "1_3"
      a: [0.5, 1, 1.5]
      b: [1, 2, 3]
      f: "${:prop==1 ? :a+'*x' : :cas==1 ? :a+'*x+'+:b : :cas==2 ? 'x*x/4' : 'x*x/6+'+:b}"
    figure:
      type: graph
      scale: 3
      boundingbox: [-1, 9, 6.5, -1]
      keepAspect: false
      axis: true
      grid: true
      content:
        - [functiongraph, "${:f}", { strokeWidth: 3, strokeColor: "#0055aa" }]
    question: Gehört diese Darstellung zu einer proportionalen Zuordnung?
    answer: "${:prop==1 ? '<b>Ja</b>: Der Graph ist eine Gerade durch den Ursprung.' : :cas==1 ? '<b>Nein</b>: Der Graph ist eine Gerade, sie geht aber nicht durch den Ursprung.' : :cas==2 ? '<b>Nein</b>: Der Graph geht durch den Ursprung, ist aber keine Gerade.' : '<b>Nein</b>: Der Graph ist keine Gerade und geht nicht durch den Ursprung.'}"
    value: ["${:prop==1 ? '\\text{ja}' : '\\text{nein}'}", "${:prop==1 ? 'ja' : 'nein'}", "${:prop==1 ? 'Ja' : 'Nein'}"]
  - name: Zwei Graphen vergleichen
    keys: ["1", "2", "_", "_"]
    vars:
      q: [1, 2]
      cas: "1_2"
      a: [0.5, 1]
      b: [1, 2]
      f1: "${:q==1 ? :a+'*x' : :cas==1 ? :a+'*x+'+:b : 'x*x/4'}"
      f2: "${:q==2 ? :a+'*x' : :cas==1 ? :a+'*x+'+:b : 'x*x/4'}"
    figure:
      type: graph
      scale: 3
      boundingbox: [-1, 9, 6.5, -1]
      keepAspect: false
      axis: true
      grid: true
      content:
        - [functiongraph, "${:f1}", { strokeWidth: 3, strokeColor: "#cc0000" }]
        - [functiongraph, "${:f2}", { strokeWidth: 3, strokeColor: "#0055aa", dash: 3 }]
        - [segment, [[0.2, 8.5], [1, 8.5]], { strokeWidth: 3, strokeColor: "#cc0000", fixed: true }]
        - [text, [1.15, 8.5, "(1)"], { fontSize: 16, strokeColor: "#cc0000", anchorY: "middle", fixed: true }]
        - [segment, [[2.4, 8.5], [3.2, 8.5]], { strokeWidth: 3, strokeColor: "#0055aa", dash: 3, fixed: true }]
        - [text, [3.35, 8.5, "(2)"], { fontSize: 16, strokeColor: "#0055aa", anchorY: "middle", fixed: true }]
    question: Welcher der beiden Graphen gehört zu einer proportionalen Zuordnung?
    answer: "Es ist der Graph <b>(:q)</b>: Er ist eine Gerade durch den Ursprung."
    value: ["${:q}", "(${:q})"]
  - name: Sachsituation
    vars:
      prop: [0, 1]
      cas: "1_2"
      a: [0.5, 1, 1.5]
      b: [1, 2]
      n: "0_3"
      f: "${:prop==1 ? :a+'*x' : :cas==1 ? :a+'*x+'+:b : 'x*x/4'}"
    figure:
      type: graph
      scale: 3
      boundingbox: [-1, 9, 6.5, -1]
      keepAspect: false
      axis: true
      grid: true
      content:
        - [functiongraph, "${:f}", { strokeWidth: 3, strokeColor: "#0055aa" }]
        - [text, [2.8, -0.75, "${:contextes[:n][0]}"], { fontSize: 14, anchorX: "middle", anchorY: "bottom", fixed: true }]
        - [text, [0.3, 8.5, "${:contextes[:n][1]}"], { fontSize: 14, fixed: true }]
    question: "Nutze den Graphen: ${:contextes[:n][2]}"
    answer: "${:prop==1 ? '<b>Ja</b>: Der Graph ist eine Gerade durch den Ursprung.' : :cas==1 ? '<b>Nein</b>: Der Graph ist eine Gerade, sie geht aber nicht durch den Ursprung.' : '<b>Nein</b>: Der Graph ist keine Gerade.'}"
    value: ["${:prop==1 ? '\\text{ja}' : '\\text{nein}'}", "${:prop==1 ? 'ja' : 'nein'}", "${:prop==1 ? 'Ja' : 'Nein'}"]
  - name: Werte am Graphen einer proportionalen Zuordnung ablesen
    keys: ["_", "_", "_", "_"]
    vars:
      a0: [0.5, 1, 1.5, 2]
      m: "1_3"
      a: "${:m==3 && :a0>1 ? 1 : :a0}"
      xq: "${:m*2}"
      yq: "${:a*:m*2}"
      sens: [0, 1]
      n: "0_3"
    figure:
      type: graph
      scale: 3
      boundingbox: [-1, 9, 6.5, -1]
      keepAspect: false
      axis: true
      grid: true
      content:
        - [functiongraph, "${:a}*x", { strokeWidth: 3, strokeColor: "#0055aa" }]
        - [text, [2.8, -0.75, "${:lectures[:n][0]}"], { fontSize: 14, anchorX: "middle", anchorY: "bottom", fixed: true }]
        - [text, [0.3, 8.5, "${:lectures[:n][1]}"], { fontSize: 14, fixed: true }]
    figureCorrection:
      type: graph
      scale: 3
      boundingbox: [-1, 9, 6.5, -1]
      keepAspect: false
      axis: true
      grid: true
      content:
        - [functiongraph, "${:a}*x", { strokeWidth: 3, strokeColor: "#0055aa" }]
        - [text, [2.8, -0.75, "${:lectures[:n][0]}"], { fontSize: 14, anchorX: "middle", anchorY: "bottom", fixed: true }]
        - [text, [0.3, 8.5, "${:lectures[:n][1]}"], { fontSize: 14, fixed: true }]
        - [segment, [["${:xq}", 0], ["${:xq}", "${:yq}"]], { strokeWidth: 2, strokeColor: "#cc0000", dash: 3, fixed: true }]
        - [segment, [[0, "${:yq}"], ["${:xq}", "${:yq}"]], { strokeWidth: 2, strokeColor: "#cc0000", dash: 3, fixed: true }]
        - [point, ["${:xq}", "${:yq}"], { face: "x", size: 4, strokeWidth: 2, strokeColor: "#cc0000", withLabel: false, fixed: true }]
    question: "${:sens==0 ? :lectures[:n][2]+' '+:xq+' '+:lectures[:n][3]+'?' : :lectures[:n][4]+' '+:yq+' '+:lectures[:n][5]+'?'}"
    answer: "${:sens==0 ? 'An der senkrechten Achse liest man <b>'+:yq+' '+:lectures[:n][5]+'</b> ab.' : 'An der waagerechten Achse liest man <b>'+:xq+' '+:lectures[:n][3]+'</b> ab.'}"
    value: ["${:sens==0 ? :yq : :xq}", "${:sens==0 ? :yq+' '+:lectures[:n][5] : :xq+' '+:lectures[:n][3]}"]
