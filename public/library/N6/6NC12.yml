title: Dezimalzahlen runden (Stellenzahl wählbar)
description: Dezimalzahlen auf Einer, Zehntel, Hundertstel oder Tausendstel runden; Runden, gerundet, Rundungsstelle. Die Zahl der angezeigten Nachkommastellen ist wählbar.
dest: [6BB]
consigne: Runde die Zahl.
options:
  - name: Auf Einer
    vars:
      multiple: [10, 100, 1000, 1000]
      entier: "0_${:multiple}"
      d: "1_9_4"
      nombre: ${:entier+0.1*:d[0]+0.01*:d[1]+0.001*:d[2]+0.0001*:d[3]}
    question:
      - ${MMmath.round(:nombre,1)}\text{ auf Einer}
      - ${MMmath.round(:nombre,2)}\text{ auf Einer}
      - ${MMmath.round(:nombre,3)}\text{ auf Einer}
      - ${MMmath.round(:nombre,4)}\text{ auf Einer}
    answer: :question \approx ${MMmath.round(:nombre,0)}\text{ auf Einer}
    value: ${MMmath.round(:nombre,0)}
  - name: Auf Zehntel
    vars:
      multiple: [10, 100, 1000, 1000]
      entier: "0_${:multiple}"
      d: "1_9_5"
      nombre: ${:entier+0.1*:d[0]+0.01*:d[1]+0.001*:d[2]+0.0001*:d[3]+0.00001*:d[4]}
    question:
      - ${MMmath.round(:nombre,2)}\text{ auf Zehntel}
      - ${MMmath.round(:nombre,3)}\text{ auf Zehntel}
      - ${MMmath.round(:nombre,4)}\text{ auf Zehntel}
      - ${MMmath.round(:nombre,5)}\text{ auf Zehntel}
    answer: :question \approx ${MMmath.round(:nombre,1)}\text{ auf Zehntel}
    value: ${MMmath.round(:nombre,1)}
  - name: Auf Hundertstel
    vars:
      multiple: [10, 100, 1000]
      entier: "0_${:multiple}"
      d: "1_9_6"
      nombre: ${:entier+0.1*:d[0]+0.01*:d[1]+0.001*:d[2]+0.0001*:d[3]+0.00001*:d[4]+0.000001*:d[5]}
    question:
      - ${MMmath.round(:nombre,3)}\text{ auf Hundertstel}
      - ${MMmath.round(:nombre,4)}\text{ auf Hundertstel}
      - ${MMmath.round(:nombre,5)}\text{ auf Hundertstel}
      - ${MMmath.round(:nombre,6)}\text{ auf Hundertstel}
    answer: :question \approx ${MMmath.round(:nombre,2)}\text{ auf Hundertstel}
    value: ${MMmath.round(:nombre,2)}
  - name: Auf Tausendstel
    vars:
      multiple: [10, 1000]
      entier: "0_${:multiple}"
      d: "1_9_7"
      nombre: ${:entier+0.1*:d[0]+0.01*:d[1]+0.001*:d[2]+0.0001*:d[3]+0.00001*:d[4]+0.000001*:d[5]+0.0000001*:d[6]}
    question:
      - ${MMmath.round(:nombre,4)}\text{ auf Tausendstel}
      - ${MMmath.round(:nombre,5)}\text{ auf Tausendstel}
      - ${MMmath.round(:nombre,6)}\text{ auf Tausendstel}
      - ${MMmath.round(:nombre,7)}\text{ auf Tausendstel}
    answer: :question \approx ${MMmath.round(:nombre,3)}\text{ auf Tausendstel}
    value: ${MMmath.round(:nombre,3)}
