<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="utf-8" />
        <style>
            @page {
                size: A4 portrait;
                margin: 0.8cm;
            }
        </style>
        <link rel="stylesheet" href="css/puzzle.css" />
        <link rel="stylesheet" href="js/libs/katex/katex.min.css" />
        <link rel="stylesheet" href="css/mm-katex.css" />
        <script
            src="js/lib.puzzle.js?v=2.0.34"
            type="module"
            id="mmscriptid"
        ></script>
        <title>Puzzle – MatheVomFranz</title>
    </head>
    <body size="A4">
        <button
            onclick="window.print()"
            class="noprint"
            title="Drucken oder als PDF speichern"
            style="
                position: absolute;
                left: 1pt;
                top: 1pt;
                width: 70pt;
                height: 18pt;
            "
        >
            🖨️ Drucken
        </button>
        <section class="noprint">
            <section class="is-flex" id="puzzleChoice">
                <article>Puzzle >></article>
                <article class="btn selected" id="btn-pyr16">
                    <span class="noselect">Pyramide, 16 Teile</span>
                    <div class="circle"></div>
                </article>
                <article class="btn" id="btn-los18">
                    <span class="noselect">Raute, 18 Teile</span>
                    <div class="circle"></div>
                </article>
                <article class="btn" id="btn-hexa24">
                    <span class="noselect">Sechseck, 24 Teile</span>
                    <div class="circle"></div>
                </article>
                <article class="btn" id="btn-pier12">
                    <span class="noselect">Stein, 12 Teile</span>
                    <div class="circle"></div>
                </article>
            </section>
            Ablenker:
            <input
                type="radio"
                id="radio-nodistract"
                name="radio-distract"
                checked
            /><label for="radio-nodistract"> ohne</label>
            <input
                type="radio"
                id="radio-distract"
                name="radio-distract"
            /><label for="radio-distract"> mit</label> |
            <label for="formulaSize">Formelgröße </label
            ><input
                type="number"
                size="6"
                id="formulaSize"
                min="0.05"
                max="2"
                step="0.05"
                value="0.35"
            />em
            <br />
            <div id="info"></div>
        </section>
        <section id="creator-content">
            <h2>Lösung</h2>
            <div id="puzzle"></div>
            <h2>Teile</h2>
            <div id="impression"></div>
        </section>
    </body>
</html>
