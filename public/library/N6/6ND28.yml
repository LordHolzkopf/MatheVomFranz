title: Einmaleins ohne schon gelernte Aufgaben (ohne 0 und 1)
dest: [WAB, 5AC]
description: "Einmaleins ohne Wiederholung der schon gelernten Aufgaben, z. B. bei der Sechserreihe nur 6 · 6 bis 6 · 10. Mögliche Reihenfolge: 2, 5, 4, 8, 9, 3, 6, 7"
type: latex # pas obligatoire, c'est la valeur par défaut
params: # Kästchen zum Ankreuzen: Werte des 2. Faktors, die nicht abgefragt werden
  n6: {groupe: Nicht abfragen, label: "6", defaut: false, exclut: {m: 6}}
  n7: {groupe: Nicht abfragen, label: "7", defaut: false, exclut: {m: 7}}
  n8: {groupe: Nicht abfragen, label: "8", defaut: false, exclut: {m: 8}}
  n9: {groupe: Nicht abfragen, label: "9", defaut: false, exclut: {m: 9}}
  n10: {groupe: Nicht abfragen, label: "10", defaut: false, exclut: {m: 10}}
options:
  - name: Zweierreihe
    vars:
      m: "2_10"
      n: 2
      r: ${2*:m}
  - name: Dreierreihe
    vars:
      m: "3_10"
      n: 3
      r: ${3*:m}
  - name: Viererreihe
    vars:
      m: "4_10"
      n: 4
      r: ${4*:m}
  - name: Fünferreihe
    vars:
      m: "5_10"
      n: 5
      r: ${5*:m}
  - name: Sechserreihe
    vars:
      m: "6_10"
      n: 6
      r: ${6*:m}
  - name: Siebenerreihe
    vars:
      m: "7_10"
      n: 7
      r: ${7*:m}
  - name: Achterreihe
    vars:
      m: "8_10"
      n: 8
      r: ${8*:m}
  - name: Neunerreihe
    vars:
      m: "9_10"
      n: 9
      r: ${9*:m}
  - name: Zehnerreihe
    vars:
      m: "10_10"
      n: 10
      r: ${10*:m}
question: # forme de question commune à toutes les options
  - :n\times:m=?
  - :r = :n\times ?
  - :r\div:n=?
answer: # à chaque question sa réponse
  - :n\times:m=\color{red}{:r}
  - :r = :n\times \color{red}{:m}
  - :r\div:n=\color{red}{:m}
value: # à chaque question la valeur attendue pour évaluation ou pour les réponses courtes dans les ceintures
  - :r
  - :m
  - :m
