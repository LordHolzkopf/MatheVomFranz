title: Koordinaten im ersten Quadranten
dest: [5BB]
type: text
textSize: medium
description: "Koordinatensystem, x-Koordinate, y-Koordinate, Koordinaten eines Punktes ablesen, Punkt eintragen, erster Quadrant. Variante „Punkt eintragen“ nicht für den Online- und Duell-Modus geeignet."
options:
  - name: Koordinaten ablesen
    vars:
      x: "0_5"
      y: "0_5"
    figure:
      type: graph
      scale: 3
      boundingbox: [-1, 6, 6, -1]
      keepAspect: false
      axis: false
      grid: true
      content:
        - - axis
          - [[0, 0], [1, 0]]
          - { ticks: { drawZero: true, label: { fontsize: 24, anchorx: "middle", anchory: "top", offset: [0, -3] } } }
        - - axis
          - [[0, 0], [0, 1]]
          - { ticks: { label: { fontsize: 24, anchorx: "right", anchory: "middle", offset: [-6, 0] } } }
        - - point
          - [:x, :y]
          - { face: "x", size: 9, strokeWidth: 3, label: { fontsize: 24 } }
    question:
      - Welche x-Koordinate hat der Punkt A?
      - Welche y-Koordinate hat der Punkt A?
      - Welche Koordinaten hat der Punkt A?
    answer:
      - Die x-Koordinate von A ist <span class='red'>:x</span>.
      - Die y-Koordinate von A ist <span class='red'>:y</span>.
      - Der Punkt A hat die Koordinaten <span class='red'>A(:x | :y)</span>.
    value:
      - ":x"
      - ":y"
      - "(:x, :y)"
  - name: Punkt eintragen
    vars:
      x: "0_5"
      y: "0_5"
    figure:
      type: graph
      scale: 3
      boundingbox: [-1, 6, 6, -1]
      keepAspect: false
      axis: false
      grid: true
      content:
        - - axis
          - [[0, 0], [1, 0]]
          - { ticks: { drawZero: true, label: { fontsize: 24, anchorx: "middle", anchory: "top", offset: [0, -3] } } }
        - - axis
          - [[0, 0], [0, 1]]
          - { ticks: { label: { fontsize: 24, anchorx: "right", anchory: "middle", offset: [-6, 0] } } }
    question: Trage den Punkt P(:x | :y) in das Koordinatensystem ein.
    answer: ""
    figureCorrection:
      type: graph
      scale: 3
      boundingbox: [-1, 6, 6, -1]
      keepAspect: false
      axis: false
      grid: true
      content:
        - - axis
          - [[0, 0], [1, 0]]
          - { ticks: { drawZero: true, label: { fontsize: 24, anchorx: "middle", anchory: "top", offset: [0, -3] } } }
        - - axis
          - [[0, 0], [0, 1]]
          - { ticks: { label: { fontsize: 24, anchorx: "right", anchory: "middle", offset: [-6, 0] } } }
        - - point
          - [:x, :y]
          - { face: "x", size: 9, strokeWidth: 3, label: { fontsize: 24 } }
