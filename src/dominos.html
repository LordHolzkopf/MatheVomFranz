<!doctype html>
<html lang="de" id="thehtml">
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <style>
            /*MMentales*/
            @page {
                size: A4 portrait;
                margin: 0.8cm;
            }
        </style>
        <title>Dominos – MatheVomFranz</title>
        <link rel="stylesheet" href="css/dominos.css" type="text/css" />
        <link rel="stylesheet" href="js/libs/katex/katex.min.css" />
        <link rel="stylesheet" href="css/mm-katex.css" />
        <script
            type="module"
            src="js/lib.dominos.js?v=2.0.34"
            id="mmscriptid"
        ></script>
    </head>
    <body size="A4">
        <button
            onclick="
                document
                    .getElementById('creator-menu')
                    .classList.toggle('hidden')
            "
            class="noprint"
            style="
                position: absolute;
                left: 0;
                top: 0;
                width: 90pt;
                height: 18pt;
            "
        >
            🛠 Seitenlayout
        </button>
        <button
            onclick="window.print()"
            class="noprint"
            title="Drucken oder als PDF speichern"
            style="
                position: absolute;
                left: 92pt;
                top: 0;
                width: 70pt;
                height: 18pt;
            "
        >
            🖨️ Drucken
        </button>
        <div id="creator-container">
            <section id="creator-menu" class="noprint hidden">
                <button
                    id="pageOrientation"
                    title="Seitenausrichtung ändern"
                >
                    Querformat
                </button>
                | Dominos:
                <input
                    type="number"
                    id="nbDominos"
                    value="28"
                    title="Anzahl der Dominos (nur wenn der Korb genau eine Aufgabe enthält)"
                    size="3"
                    min="2"
                    max="180"
                />
                <button id="btnnodoublon" title="Doppelte Dominos entfernen oder zulassen">
                    Doppelte entfernen
                </button>
                <button id="btnshuffle">Mischen</button>
                <button
                    id="btneditcontent"
                    title="Inhalt der Dominos bearbeiten"
                >
                    Inhalt bearbeiten
                </button>
                <span id="infoErrorDouble"></span>
                <br />Gestaltung:
                <!--<button id="btnedit" title="Remplacer la barre par un titre">Éditer</button> -->
                <input
                    type="file"
                    id="file"
                    name="myImage"
                    accept="image/x-png,image/gif,image/jpeg"
                />
                <label for="file">
                    <span class="glow-on-hover">Bild</span>
                </label>
                <button id="deleteImg" title="Hintergrundbild entfernen">
                    X
                </button>
                Breite:
                <input
                    id="inputwidth"
                    value="60"
                    title="Breite eines Dominos"
                    type="number"
                    size="3"
                    min="60"
                    max="180"
                />
                Höhe:
                <input
                    id="inputheight"
                    value="25"
                    title="Höhe eines Dominos"
                    type="number"
                    size="3"
                    min="25"
                    max="180"
                />
                | Schrift:
            </section>
            <section id="tab-accueil" class="noprint"></section>
            <section id="creator-content"></section>
        </div>
    </body>
</html>
