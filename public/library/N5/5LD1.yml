title: 'Wissen: Statistik'
type: text
description: "10 Wissensfragen zu Begriffen und Formeln der Statistik: Grundgesamtheit, Merkmal, absolute und relative Häufigkeit, Mittelwert, gewichteter Mittelwert, Diagramme, Tabellenkalkulation. Nicht für den interaktiven Modus (online/Duell) geeignet."
dest: [6FA, 6FC, 6FB]
options:
  - name: Begriffe
    question:
      - Was versteht man in der Statistik unter der <b>Grundgesamtheit</b>?
      - Was versteht man in der Statistik unter einem <b>Merkmal</b>?
      - Welche Arten von Merkmalen gibt es?
      - Was ist die <b>absolute Häufigkeit</b> eines Wertes?
    answer:
      - Die Grundgesamtheit ist die Menge aller Personen oder Dinge, die bei einer Erhebung untersucht werden.
      - Ein Merkmal ist die Eigenschaft, nach der bei einer statistischen Erhebung gefragt wird (z. B. Alter, Lieblingsfarbe). Die möglichen Werte heißen Merkmalsausprägungen.
      - "Ein Merkmal kann <b>quantitativ</b> sein: Seine Werte sind Zahlen, die man zählen oder messen kann (Anzahl, Länge …). Oder es ist <b>qualitativ</b>: Seine Werte sind keine Zahlen (Farbe, Geschmack …)."
      - Die absolute Häufigkeit eines Wertes gibt an, <b>wie oft</b> dieser Wert vorkommt.
  - name: Berechnungen und Formeln
    question:
      - Wie bestimmt man die <b>Gesamtzahl</b> aller Werte?
      - Wie berechnet man die <b>relative Häufigkeit</b> eines Wertes?
      - Wie berechnet man den <b>Mittelwert</b> (das arithmetische Mittel) einer Datenreihe?
      - Wie berechnet man den <b>gewichteten Mittelwert</b> einer Datenreihe?
    answer:
      - Man zählt, wie viele Werte es insgesamt gibt, oder addiert alle absoluten Häufigkeiten.
      - Die relative Häufigkeit eines Wertes ist der Quotient $$\dfrac{\text{absolute Häufigkeit des Wertes}}{\text{Gesamtzahl aller Werte}}$$. Man gibt sie als Bruch, als Dezimalzahl oder in Prozent an.
      - Man addiert alle Werte und dividiert die Summe durch die Anzahl der Werte $$\dfrac{v_1+v_2+...}{\text{Anzahl der Werte}}$$
      - Der gewichtete Mittelwert ist eine Abkürzung beim Berechnen des Mittelwerts. Man multipliziert jeden Wert mit seiner absoluten Häufigkeit, addiert diese Produkte und dividiert durch die Gesamtzahl der Werte.<br>$$\dfrac{n_1\times v_1+n_2\times v_2+...}{n_1+n_2+...}$$
  - name: Darstellungen
    question:
      - Wie kann man die Ergebnisse einer statistischen Erhebung darstellen?
      - Welches Computerprogramm hilft beim Auswerten statistischer Daten?
    answer:
      - Als Urliste, als Strichliste oder Häufigkeitstabelle, als Säulen- oder Balkendiagramm, als Kreis- oder Halbkreisdiagramm.
      - Eine <b>Tabellenkalkulation</b> (z. B. LibreOffice Calc), mit der man auch Diagramme erstellen kann.
